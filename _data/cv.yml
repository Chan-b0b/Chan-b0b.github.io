        highlights:
          - "IK+IL learning framework (independently developed): 95% pick-and-place success on Unitree G1, reduced teleoperation dependency"
          - "SAM2-based auto-labeling system: text input → automatic YOLO training data generation, eliminating manual labeling"
          - "Real-robot deployment: Unitree G1 and H1-2 humanoid locomotion and manipulation policies"
          - "VLA fine-tuning: GR00T, SmolVLA, ACT models adapted for manufacturing domain"
          - "PoC clients: LG Chem (quadruped robot), LG Energy Solution (battery cell sorting), Market Kurly (bin stacking logistics), Daehan Steel"
          - "Global collaboration: technical discussions with Skild, ARI Robotics (in English)"

      - company: LG CNS
