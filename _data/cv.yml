      - title: "Is View Planning Always Effective for 3D Reconstruction?"
        authors:
          - Chanho Lee
          - David Han
        publisher: Journal of Artificial Intelligence Research and Applications (JAIRA)
        releaseDate: 2025-11-30
        summary: "Introduced PIFu-A (pixel-aligned implicit function + attention encoder) for multi-view 3D reconstruction. RL-based next-best-view planning (PPO). View planning is more effective for geometric than semantic models (up to 80% improvement). Validated on ShapeNet (39,699 models, 13 categories)."

