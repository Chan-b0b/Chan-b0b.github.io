        location: Seoul, Republic of Korea
        start_date: 2023-11
        end_date: 2024-12
        summary: "Vision AI Business Team — Developed steel scrap grading AI for Daehan Steel."
        highlights:
          - "Accuracy 70% → 93% (+23%p) by applying pixel-aligned structure from 3D reconstruction domain"
          - "Optimized to 30-second processing per truck; fully deployed to production"
          - "Joint venture established with client; system commercialized"
          - "CLIP-based VLM experiments: scrap characteristic–image matching"
          - "Data pipeline optimization: enabled full daily throughput processing"

    Publications:
      - title: "Dynamic-Persistent CSMA: A Reinforcement Learning Approach for Multi-User Channel Access"
        authors:
          - Chanho Lee
          - Seungkeun Park
          - Taesu Cheong
        publisher: IEEE Access
        releaseDate: 2024-11-27
        url: https://ieeexplore.ieee.org/document/10771609
        summary: "Proposed DP-CSMA using hierarchical RL with LSTM-based VAE + SAC. Achieves zero-shot generalization: trained on 5–10 agents, achieves top throughput in 100-agent environments."

      - title: "Is View Planning Always Effective for 3D Reconstruction?"
        authors:
          - Chanho Lee
          - David Han
        publisher: Journal of Artificial Intelligence Research and Applications (JAIRA)
        releaseDate: 2025-11-30
        summary: "Introduced PIFu-A (pixel-aligned implicit function + attention encoder) for multi-view 3D reconstruction. RL-based next-best-view planning (PPO). View planning is more effective for geometric than semantic models (up to 80% improvement). Validated on ShapeNet (39,699 models, 13 categories)."

